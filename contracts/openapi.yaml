openapi: 3.1.0
info:
  title: Indico AI Test Automation API
  version: 0.1.0
  description: Initial contract placeholder. API operations are added with the Laravel service.
paths:
  /health:
    get:
      summary: Service health check
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
components:
  schemas:
    TestCase:
      $ref: ./test_case.schema.json
